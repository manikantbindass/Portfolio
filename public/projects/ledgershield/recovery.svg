<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title"><title id="title">LedgerShield — evidence, guards, verification and rollback</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1120"/><stop offset="1" stop-color="#111c2d"/></linearGradient><linearGradient id="glass" x2=".6" y2="1"><stop stop-color="#c9d4ff" stop-opacity=".13"/><stop offset="1" stop-color="#c9d4ff" stop-opacity=".025"/></linearGradient><linearGradient id="edge"><stop stop-color="#b4a1f5"/><stop offset="1" stop-color="#68dacb"/></linearGradient><radialGradient id="light"><stop stop-color="#68dacb" stop-opacity=".13"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="1198" height="758" rx="36" fill="url(#bg)" stroke="#2e3858"/><ellipse cx="910" cy="260" rx="410" ry="340" fill="url(#light)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="60" y="64" fill="#b4a1f5" font-size="11" letter-spacing="2">LEDGERSHIELD / GUARDED RECOVERY</text><text x="56" y="137" fill="#f2f5ff" font-size="48" letter-spacing="-1.5">Evidence before action.</text><text x="60" y="181" fill="#a4afc3" font-size="19" >A reversible research loop with explicit operating boundaries.</text><rect x="60" y="223" width="628" height="88" rx="23" fill="url(#glass)" stroke="#9eabe0" stroke-opacity=".23"/><text x="83" y="257" fill="#b4a1f5" font-size="11" >01</text><text x="124" y="258" fill="#eef1fc" font-size="22" >Observe</text><text x="124" y="286" fill="#a4afc3" font-size="15" >Signed transfers and simulator telemetry</text><path d="M374 313v15m-4-4 4 4 4-4" fill="none" stroke="#68dacb" stroke-opacity=".65"/><rect x="60" y="331" width="628" height="88" rx="23" fill="url(#glass)" stroke="#9eabe0" stroke-opacity=".23"/><text x="83" y="365" fill="#b4a1f5" font-size="11" >02</text><text x="124" y="366" fill="#eef1fc" font-size="22" >Explain</text><text x="124" y="394" fill="#a4afc3" font-size="15" >Evidence provenance and bounded trust</text><path d="M374 421v15m-4-4 4 4 4-4" fill="none" stroke="#68dacb" stroke-opacity=".65"/><rect x="60" y="439" width="628" height="88" rx="23" fill="url(#glass)" stroke="#9eabe0" stroke-opacity=".23"/><text x="83" y="473" fill="#b4a1f5" font-size="11" >03</text><text x="124" y="474" fill="#eef1fc" font-size="22" >Guard</text><text x="124" y="502" fill="#a4afc3" font-size="15" >Mode, approval, quorum and cooldowns</text><path d="M374 529v15m-4-4 4 4 4-4" fill="none" stroke="#68dacb" stroke-opacity=".65"/><rect x="60" y="547" width="628" height="88" rx="23" fill="url(#glass)" stroke="#9eabe0" stroke-opacity=".23"/><text x="83" y="581" fill="#b4a1f5" font-size="11" >04</text><text x="124" y="582" fill="#eef1fc" font-size="22" >Verify</text><text x="124" y="610" fill="#a4afc3" font-size="15" >New commit, audit record or rollback</text><rect x="718" y="223" width="422" height="412" rx="26" fill="url(#glass)" stroke="#9eabe0" stroke-opacity=".23"/><g transform="translate(929 350) scale(0.65)"><path d="M0-108 80-76V-7C80 49 43 88 0 112-43 88-80 49-80-7v-69Z" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.6"/><path d="M0-94 67-67V-7C67 43 37 75 0 98-37 75-67 43-67-7v-60Z" fill="none" stroke="#b4a1f5" stroke-opacity=".17"/><circle r="36" fill="url(#glass)" stroke="#68dacb" stroke-opacity=".25"/><path d="m-20 0 14 14 29-29" fill="none" stroke="#68dacb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="749" y="466" fill="#eef1fc" font-size="23" >Research scope, made clear.</text><text x="749" y="505" fill="#a4afc3" font-size="15" >Centralized, seeded network simulator.</text><text x="749" y="534" fill="#a4afc3" font-size="15" >No real P2P or formal PBFT guarantee.</text><text x="749" y="563" fill="#a4afc3" font-size="15" >Offline DQN; rule-based live policy.</text><text x="749" y="592" fill="#a4afc3" font-size="15" >Durable evidence; volatile live state.</text><text x="60" y="725" fill="#75839e" font-size="10" letter-spacing="1.1">EXPLANATORY DIAGRAM · NOT LIVE TELEMETRY OR A SECURITY CERTIFICATION</text></g></svg>